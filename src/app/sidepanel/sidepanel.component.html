<div class="sidepanel" [class.closed]="!isOpen()">
  <!--   <p-button
    icon="pi pi-times"
    aria-label="close"
    variant="outlined"
    (click)="close()"
    class="close-button"
  /> -->
  <button
    aria-label="open"
    (click)="isOpen() ? close() : open()"
    class="sidepanel-arrow"
    [class.close]="isOpen()"
  >
    <i class="pi pi-chevron-left"></i>
  </button>
  <div class="sidepanel-content">
    <ng-container #dynamicContent></ng-container>
  </div>
</div>
