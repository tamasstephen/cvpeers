<ng-container *ngIf="!hasConsent && !isPrivacyPage">
  <div class="consent-backdrop"></div>
  <div class="consent-dialog" role="dialog" aria-modal="true">
    <div class="consent-content">
      <h2 class="title">🍪 We value your privacy</h2>
      <p>
        We use strictly necessary cookies to make the CV generator work. Read our
        <a routerLink="/privacy">Privacy Policy</a> for more details.
      </p>
      <div class="consent-actions">
        <button mat-flat-button color="primary" (click)="acceptConsent()">Accept</button>
      </div>
    </div>
  </div>
</ng-container>
