<h2>Template Selector</h2>
<fieldset class="v-stack gap-12">
  <mat-form-field appearance="outline">
    <mat-label>Select Template</mat-label>
    <mat-select
      id="template-select"
      [value]="templateForm.value"
      (selectionChange)="templateForm.setValue($event.value)"
      required>
      <mat-option [value]="templates.MINIMAL">Minimal</mat-option>
      <mat-option [value]="templates.CLASSIC">Classic</mat-option>
    </mat-select>
  </mat-form-field>
</fieldset>
