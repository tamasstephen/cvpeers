<mat-dialog-content>
  <div class="dialog-content" [formGroup]="experienceItemForm">
    <mat-form-field appearance="outline">
      <mat-label>Job Title</mat-label>
      <input matInput id="title" formControlName="title" required />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Company</mat-label>
      <input matInput id="company" formControlName="company" required />
    </mat-form-field>
    <div class="dates">
      <mat-form-field appearance="outline">
        <mat-label>Start Date</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="startDate" required />
        <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker startView="multi-year"></mat-datepicker>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>End Date</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="endDate" />
        <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker startView="multi-year"></mat-datepicker>
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline">
      <mat-label>Location</mat-label>
      <input matInput id="location" formControlName="location" required />
    </mat-form-field>
    <div class="description" formArrayName="description">
      <mat-label>Description</mat-label>
      @for (description of experienceItemForm.controls.description.controls; track $index) {
        <div class="description-item">
          <mat-form-field appearance="outline" class="description-field">
            <mat-label>Entry {{ $index + 1 }}</mat-label>
            <input matInput [formControlName]="$index" required />
          </mat-form-field>
          @if ($index === 0) {
            <button mat-icon-button color="primary" type="button" (click)="addDescriptionField()">
              <mat-icon>add</mat-icon>
            </button>
          } @else {
            <button
              mat-icon-button
              color="warn"
              type="button"
              (click)="removeDescriptionField($index)">
              <mat-icon>delete</mat-icon>
            </button>
          }
        </div>
      }
    </div>
    <div class="actions">
      <button
        mat-flat-button
        color="primary"
        (click)="saveExperience()"
        [disabled]="!experienceItemForm.valid">
        Save
      </button>
      <button mat-stroked-button type="button" (click)="closeDialog()">Cancel</button>
    </div>
  </div>
</mat-dialog-content>
