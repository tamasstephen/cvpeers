<h2>Personal Details</h2>
<fieldset [formGroup]="personalDetailsForm">
  <mat-form-field appearance="outline">
    <mat-label>Full Name</mat-label>
    <input matInput id="fullName" formControlName="fullName" required />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input matInput type="email" id="email" formControlName="email" required />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Phone</mat-label>
    <input matInput id="phone" formControlName="phone" required />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Website</mat-label>
    <input matInput id="website" formControlName="website" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Headline</mat-label>
    <input matInput id="headline" formControlName="headline" />
  </mat-form-field>
</fieldset>
